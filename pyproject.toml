[project]
name = "sinhala-asr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=1.3",
    "jiwer>=4.0.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyarrow>=26.0.0",
    "quan-transcribe",
    "safetensors>=0.8.0",
    "sentence-transformers>=6.1",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "torch>=2.6",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "transformers>=5.19",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sinhala_asr"]

[tool.uv.sources]
quan-transcribe = { git = "https://github.com/qnguyen3/QUAN-Transcribe" }
